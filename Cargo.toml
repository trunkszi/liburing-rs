[workspace]
members = ["crates/*"]
default-members = ["crates/liburing"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/trunkszi/liburing-rs"

[workspace.dependencies]
liburing = { path = "crates/liburing", package = "liburing-proactor" }
io-uring = { version = "0.7.15" }
liburing-macros = { path = "crates/liburing-macros" }
libc = { version = "0.2" }
thiserror = { version = "2" }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = { version = "1" }
proc-macro2 = { version = "1" }
static_assertions = { version = "1" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
clone_on_copy = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
unnecessary_to_owned = "deny"
cloned_instead_of_copied = "deny"
inefficient_to_string = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
expl_impl_clone_on_copy = "deny"
non_canonical_clone_impl = "deny"
useless_conversion = "deny"
useless_asref = "deny"
to_string_in_format_args = "deny"
manual_string_new = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 0
debug = false
strip = "debuginfo"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.test]
inherits = "dev"
opt-level = 0
debug = false
strip = "debuginfo"
incremental = false

[profile.release]
panic = "abort"
